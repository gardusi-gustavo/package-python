[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gardusi-gustavo-python"
version = "0.3.0"
description = "Gardusi Gustavo Python ETL contracts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/python_etl"]

[project.urls]
Homepage = "https://github.com/gardusi-gustavo/package-python"
