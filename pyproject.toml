[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-etl-contracts"
version = "0.2.11"
description = "Reusable web ETL library"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["build", "twine", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/python_etl"]
