name: ci
on:
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run local CI
        run: bash infra/scripts/ci/entrypoint.sh
