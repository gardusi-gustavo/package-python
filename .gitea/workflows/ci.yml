name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ci-universal
    timeout-minutes: 15
    env:
      GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run local CI
        run: bash infra/scripts/ci/entrypoint.sh
