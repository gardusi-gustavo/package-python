name: release
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bootstrap sb
        run: |
          tag="$(jq -r '.dependencies["templates/sh"]' infra/config/repo.json)"
          echo "SB_TAG=$tag" >> "$GITHUB_ENV"
          curl -fsSL "$GITEA_URL/templates/sh/raw/tag/$tag/bin/sb" -o /tmp/sb
          chmod +x /tmp/sb
      - name: Fetch pinned shell toolset
        run: /tmp/sb fetch-all
      - name: Release from VERSION
        run: /tmp/sb run release -- --root .
        env:
          GITEA_URL: http://gitea:3000
