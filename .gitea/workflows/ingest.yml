name: ingest
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ingest script when present
        run: |
          if [ -x infra/scripts/ingest.sh ]; then
            bash infra/scripts/ingest.sh
          else
            echo "no infra/scripts/ingest.sh; nothing to ingest"
          fi
